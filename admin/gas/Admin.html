<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admin — ARIYAPALA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Archivo:wght@900&display=swap" rel="stylesheet">
<style>
  :root{
    --hutan:#0d3b2e;--hutan-tua:#0a2e24;--daun:#1a6b4a;--emas:#f7c948;--emas-tua:#e8940a;
    --navi:#183c5e;--lava:#dc3a23;--kertas:#f3f7f4;--abu:#5c6f66;--garis:#e2ece6;
    --radius:16px;--bayang:0 10px 30px rgba(13,59,46,.10);--bayang-kuat:0 18px 45px rgba(13,59,46,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;background:var(--kertas);color:#22352d;line-height:1.55;min-height:100vh}
  ::selection{background:var(--navi);color:var(--emas)}
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

  /* ====== SIDEBAR ===== */
  aside{background:linear-gradient(160deg,var(--hutan-tua),#0e3145 78%,var(--navi));color:#cfe3d7;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
  .brand img{width:44px;height:44px;border-radius:12px;background:#fff;padding:2px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .brand b{color:#fff;font-family:'Archivo',sans-serif;font-size:.95rem;display:block;letter-spacing:.03em}
  .brand small{color:var(--emas);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .tab{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:#b9d4c5;font:inherit;font-weight:600;font-size:.9rem;padding:11px 13px;border-radius:11px;cursor:pointer;transition:.2s;text-align:left}
  .tab:hover{background:rgba(255,255,255,.08);color:#fff}
  .tab.aktif{background:linear-gradient(135deg,var(--emas),var(--emas-tua));color:var(--hutan-tua);box-shadow:0 6px 16px rgba(247,201,72,.28)}
  .tab .cnt{margin-left:auto;font-size:.7rem;font-weight:800;background:rgba(0,0,0,.16);padding:2px 8px;border-radius:99px}
  .tab.aktif .cnt{background:rgba(13,59,46,.22)}
  .sisi-bawah{margin-top:auto;font-size:.68rem;color:#7fa292;padding:10px 8px;border-top:1px solid rgba(255,255,255,.10)}

  /* ====== MAIN ====== */
  main{padding:0 clamp(16px,3vw,34px) 44px;max-width:1180px}
  .atas{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 0 16px}
  .atas h1{font-family:'Archivo',sans-serif;color:var(--hutan-tua);font-size:1.35rem;font-weight:900;display:flex;align-items:center;gap:10px}
  .atas h1 .sub{font-size:.72rem;font-family:'Plus Jakarta Sans';color:var(--abu);font-weight:600;background:#fff;border:1px solid var(--garis);padding:3px 10px;border-radius:99px}
  .siapa{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--abu)}
  .siapa .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--daun),var(--navi));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem}

  .kartu{background:#fff;border-radius:var(--radius);box-shadow:var(--bayang);overflow:hidden}
  .alat{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--garis);flex-wrap:wrap}
  .cari{flex:1;min-width:180px;position:relative}
  .cari input{width:100%;padding:9px 12px 9px 34px;border:2px solid #e4ede7;border-radius:10px;font:inherit;font-size:.85rem;background:#fbfdfc;transition:.2s}
  .cari input:focus{outline:none;border-color:var(--daun);box-shadow:0 0 0 4px rgba(26,107,74,.10)}
  .cari::before{content:"🔍";position:absolute;left:10px;top:8px;font-size:.8rem;opacity:.55}
  .btn{border:none;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;font-size:.84rem;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px}
  .btn:active{transform:scale(.97)}
  .btn-em{background:linear-gradient(135deg,var(--emas),var(--emas-tua));color:var(--hutan-tua);box-shadow:0 6px 14px rgba(247,201,72,.3)}
  .btn-em:hover{transform:translateY(-1px);box-shadow:0 9px 18px rgba(247,201,72,.4)}
  .btn-h{background:var(--hutan);color:#fff}.btn-h:hover{background:var(--hutan-tua)}
  .btn-g{background:#fff;border:2px solid var(--garis);color:var(--hutan)}
  .btn-d{background:#fdecec;color:#a3302b}

  .wrap{overflow:auto;max-height:calc(100vh - 250px)}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th{background:linear-gradient(180deg,#f0f6f2,#e9f2ec);color:var(--hutan-tua);text-align:left;padding:11px 14px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;position:sticky;top:0;z-index:2;border-bottom:2px solid #dbe7df;white-space:nowrap}
  td{padding:11px 14px;border-bottom:1px solid #eef3f0;vertical-align:top;overflow-wrap:anywhere}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:#f7fbf8}
  td img.th{width:46px;height:46px;object-fit:cover;border-radius:10px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18);cursor:zoom-in;transition:.2s}
  td img.th:hover{transform:scale(1.35);z-index:5;position:relative}
  .chip{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.04em;padding:3px 10px;border-radius:99px;background:rgba(24,60,94,.1);color:var(--navi);border:1px solid rgba(24,60,94,.25)}
  .chip.arsip{background:rgba(220,58,35,.1);color:var(--lava);border-color:rgba(220,58,35,.3)}
  .aksi{white-space:nowrap;text-align:right}
  .aksi .mini-b{border:1px solid var(--garis);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:.8rem;transition:.15s}
  .aksi .mini-b:hover{border-color:var(--daun);transform:translateY(-1px)}
  .aksi .hapus:hover{border-color:#e3a19c;background:#fff5f4}
  .kosong{padding:52px 20px;text-align:center;color:var(--abu)}
  .kosong .gunung{font-size:2.6rem;display:block;margin-bottom:10px}
  .loading{padding:44px;text-align:center;color:var(--abu);font-size:.85rem}
  .spinner{width:26px;height:26px;border:3px solid #dfe9e2;border-top-color:var(--daun);border-radius:50%;margin:0 auto 12px;animation:putar .8s linear infinite}
  @keyframes putar{to{transform:rotate(360deg)}}

  /* ====== SLIDE-OVER FORM ====== */
  .selubung{position:fixed;inset:0;background:rgba(7,28,21,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .selubung.buka{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:-560px;width:min(540px,94vw);height:100vh;background:#fff;box-shadow:-18px 0 50px rgba(0,0,0,.25);z-index:41;transition:right .3s cubic-bezier(.2,.8,.25,1);display:flex;flex-direction:column}
  .panel.buka{right:0}
  .panel .kep{padding:18px 22px;background:linear-gradient(125deg,var(--hutan-tua),#0e3145);color:#fff;display:flex;align-items:center;gap:12px}
  .panel .kep b{font-family:'Archivo',sans-serif;font-size:1rem}
  .panel .kep small{display:block;font-size:.68rem;color:var(--emas);letter-spacing:.12em;text-transform:uppercase}
  .panel .kep .x{margin-left:auto;background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:9px;font-size:1.1rem;cursor:pointer}
  .panel .kep .x:hover{background:rgba(255,255,255,.25)}
  .isi-panel{padding:20px 22px;overflow:auto;flex:1}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 14px}
  .f{display:flex;flex-direction:column;gap:5px}
  .f.full{grid-column:1/-1}
  .f label{font-size:.74rem;font-weight:800;color:var(--hutan-tua);letter-spacing:.02em}
  .f label i{color:var(--lava);font-style:normal}
  .f input[type=text],.f textarea{width:100%;padding:10px 12px;border:2px solid #dfe9e2;border-radius:10px;font:inherit;font-size:.88rem;background:#fbfdfc;transition:.2s}
  .f textarea{min-height:86px;resize:vertical}
  .f input:focus,.f textarea:focus{outline:none;border-color:var(--daun);box-shadow:0 0 0 4px rgba(26,107,74,.10);background:#fff}
  .drop{border:2px dashed #c9dad0;border-radius:12px;padding:14px;text-align:center;font-size:.8rem;color:var(--abu);cursor:pointer;transition:.2s;background:#fbfdfc}
  .drop.seret,.drop:hover{border-color:var(--daun);background:#f2f9f4;color:var(--hutan)}
  .drop img{width:64px;height:64px;object-fit:cover;border-radius:10px;box-shadow:var(--bayang);margin-bottom:6px}
  .bawah-panel{padding:16px 22px;border-top:1px solid var(--garis);display:flex;gap:10px;align-items:center;background:#f8fbf9}
  .bawah-panel .info{font-size:.72rem;color:var(--abu);margin-right:auto}

  /* ====== TOAST ====== */
  #toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-130%);z-index:60;padding:12px 22px;border-radius:12px;font-size:.88rem;font-weight:700;color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.2,.8,.3,1.2);max-width:min(520px,92vw)}
  #toast.tampil{transform:translate(-50%,0)}
  #toast.ok{background:linear-gradient(135deg,var(--daun),var(--hutan))}
  #toast.er{background:linear-gradient(135deg,#c9361f,#8c1f10)}
  #toast.info{background:linear-gradient(135deg,var(--navi),#0e2438)}

  @media(max-width:840px){
    .app{grid-template-columns:1fr}
    aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
    .brand{border:none;padding:0 10px 0 0;margin:0}
    .sisi-bawah{display:none}
    .tab{width:auto;padding:8px 11px;font-size:.78rem}
    .form-grid{grid-template-columns:1fr}
  }
</style>
</head>

const isImg=k=>k.indexOf('g')>0, isTA=k=>k.indexOf('t')>0, isReq=k=>k[2]===WAJIB;
let TAB='BERITA', DATA=[], SEDANG_EDIT=null, GAMBAR_SIAP={};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const urlImg=id=>id&&!/^https?:/.test(id)?'https://lh3.googleusercontent.com/d/'+id:(id||'');
function toast(m,t='ok'){const x=el('toast');x.textContent=m;x.className=t+' tampil';clearTimeout(x._t);x._t=setTimeout(()=>x.className='',3200)}
function fieldWajib(f){return !!f[2]&&f[2]!==WAJIB?false:f[2]===WAJIB||String(f[2])==='1'||(f[2]===1)}

/* ================= navigasi ================= */
(function(){
  const nav=el('tabs');
  Object.keys(SKEMA).forEach(t=>{
    const b=document.createElement('button');
    b.className='tab';b.dataset.t=t;
    b.innerHTML=SKEMA[t].ikon+' '+esc(SKEMA[t].judul)+'<span class="cnt" id="cnt-'+t+'">–</span>';
    b.onclick=()=>pilihTab(t);
    nav.appendChild(b);
  });
  pilihTab('BERITA');
  panggil({op:'who'},r=>{el('nama-user').textContent=r.email.split('@')[0];el('avatar').textContent=r.email.trim()[0].toUpperCase()},
    ()=>{el('nama-user').innerHTML='⚠ email Anda tak diizinkan';toast('Akses ditolak server — buka dengan akun yang terdaftar ADMIN_EMAILS','er')});
})();
function pilihTab(t){
  TAB=t; DATA=[];
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('aktif',x.dataset.t===t));
  el('judul').firstChild.textContent=SKEMA[t].ikon+' '+SKEMA[t].judul+' ';
  el('q').value='';
  muat();
}
function panggil(req, lalu, gagal){
  el('daftar').style.opacity=.55;
  google.script.run
    .withSuccessHandler(res=>{el('daftar').style.opacity=1;let r;try{r=JSON.parse(res)}catch(e){r={ok:false,error:'Respons rusak'}}
      if(!r.ok){toast(r.error,'er'); if(gagal)gagal(); return}
      lalu(r);})
    .withFailureHandler(err=>{el('daftar').style.opacity=1;toast('Jaringan/GAS: '+err,'er'); if(gagal)gagal()})
    .adminCall(req);
}
function muat(){
  el('daftar').innerHTML='<div class="loading"><div class="spinner"></div>memuat data…</div>';
  panggil({op:'list',sheet:TAB},r=>{DATA=r.data;const c=el('cnt-'+TAB);if(c)c.textContent=DATA.length;renderTabel()});
}

/* ================= tabel ================= */
function renderTabel(){
  const sk=SKEMA[TAB], q=el('q').value.toLowerCase();
  const tampil=DATA.filter(row=>!q||Object.values(row).some(v=>String(v).toLowerCase().includes(q)));
  el('hitung').textContent=DATA.length+' data'+(q?' → '+tampil.length:'');
  if(!tampil.length){
    el('daftar').innerHTML='<div class="kosong"><span class="gunung">⛰️</span>'+(DATA.length?
      'Tidak ada yang cocok dengan pencarian.':'Belum ada data di <b>'+esc(sk.judul)+'</b> — tekan <b>＋ Tambah Data</b> untuk mulai.')+'</div>';
    return;
  }
  el('daftar').innerHTML='<div class="wrap"><table><thead><tr>'+sk.kolom.map(k=>'<th>'+esc(String(k[1]).replace(/\*/g,'').split(',')[0])+'</th>').join('')+'<th style="text-align:right">Aksi</th></tr></thead><tbody>'+
    tampil.map((row,i)=>{
      const idx=DATA.indexOf(row);
      return '<tr>'+sk.kolom.map(k=>{
        const v=row[k[0]]||'';
        if(isImg(k)) return '<td>'+(v?'<img class="th" src="'+esc(urlImg(v))+'" onclick="window.open(this.src)" onerror="this.outerHTML=\'<span class=&quot;chip&quot;>?</span>\'">':'—')+'</td>';
        if(k[0]==='badge'||k[0]==='label') return '<td>'+(v?'<span class="chip'+(k[0]==='badge'?' arsip':'')+'">'+esc(v)+'</span>':'—')+'</td>';
        if(k[0]==='aktif') return '<td>'+(String(v)[0]==='n'?'<span class="chip arsip">tersembunyi</span>':'<span class="chip">tampil</span>')+'</td>';
        return '<td>'+esc(v.length>110?v.slice(0,110)+'…':v)+'</td>';
      }).join('')+
      '<td class="aksi"><button class="mini-b" title="Ubah" onclick="bukaForm('+idx+')">✏️</button> <button class="mini-b hapus" title="Hapus" onclick="hapus('+idx+')">🗑</button></td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ================= form ================= */
function bukaForm(idx){
  SEDANG_EDIT=idx==null?null:idx;
  const sk=SKEMA[TAB], row=idx==null?{}:DATA[idx];
  GAMBAR_SIAP={};
  el('form-judul').textContent=(idx==null?'Tambah — ':'Ubah — ')+sk.judul;
  el('form-tab').textContent=TAB+(idx!=null?(' · '+(row.id||row.key||'')):'');
  el('form').innerHTML=sk.kolom.map((k,i)=>{
    const v=row[k[0]]||'';
    const tipe = isImg(k)?'g' : isTA(k)?'t' : 'text';
    const ph   = (typeof k[3]==='string' && k[3]!=='t' && k[3]!=='g') ? k[3] : '';
    let inp;
    if(tipe==='t') inp='<textarea id="f'+i+'">'+esc(v)+'</textarea>';
    else if(tipe==='g') inp='<div class="drop" id="drop'+i+'" onclick="el(\'g'+i+'\').click()">'+
        (v?'<img src="'+esc(urlImg(v))+'"><br>ganti gambar? klik di sini':'klik / seret gambar ke sini<br><b style="color:var(--hutan)">PNG/JPG ≤ 4 MB</b>')+
        '<input type="file" id="g'+i+'" accept="image/*" hidden onchange="unggah(this,'+i+')"></div>';
    else inp='<input type="text" id="f'+i+'" value="'+esc(v)+'" placeholder="'+esc(ph)+'">';
    GAMBAR_SIAP['f'+i]=(tipe==='g')?(v||''):undefined;
    return '<div class="f'+(tipe!=='text'?' full':'')+'"><label>'+esc(k[1])+(isReq(k)?' <i>*</i>':'')+'</label>'+inp+'</div>';
  }).join('');
  // dropzone drag-drop
  sk.kolom.forEach((k,i)=>{
    if(isImg(k)){
      const d=el('drop'+i);
      d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('seret')});
      d.addEventListener('dragleave',()=>d.classList.remove('seret'));
      d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('seret');
        const f=e.dataTransfer.files[0]; if(!f||!f.type.startsWith('image/'))return toast('Bukan berkas gambar','er');
        const inp=el('g'+i); const dt=new DataTransfer(); dt.items.add(f); inp.files=dt.files; unggah(inp,i);});
      d.dataset.gambar=k[0];
    }
  });
  el('panel').classList.add('buka'); el('selubung').classList.add('buka');
  const f0=el('form').querySelector('input,textarea'); if(f0)f0.focus();
}
function tutupForm(){el('panel').classList.remove('buka');el('selubung').classList.remove('buka')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')tutupForm()});

function unggah(inp,i){
  const f=inp.files[0]; if(!f)return;
  if(f.size>4*1024*1024){toast('Gambar > 4 MB — perkecil dulu ya','er');inp.value='';return}
  const r=new FileReader();
  r.onload=()=>{toast('Mengunggah gambar…','info');
    panggil({op:'upload',sheet:TAB,file:{name:f.name,mime:f.type,b64:r.result.split(',')[1]}},res=>{
      GAMBAR_SIAP['f'+i]=res.id;
      el('drop'+i).innerHTML='<img src="'+esc(res.url)+'"><br><b style="color:var(--daun)">✓ terunggah — jangan lupa Simpan</b>';
    });};
  r.readAsDataURL(f);
}
function simpan(e){
  e.preventDefault();
  const sk=SKEMA[TAB], row={}, idf=TAB==='KONTAK'?'key':'id';
  let kurang=false;
  sk.kolom.forEach((k,i)=>{
    let v;
    if(isImg(k)) v=GAMBAR_SIAP['f'+i]||'';
    else v=el('f'+i).value.trim();
    if(isReq(k)&&!v)kurang=true;
    row[k[0]]=v;
  });
  if(kurang){toast('Lengkapi kolom bertanda * dulu','er');return}
  if(SEDANG_EDIT!=null) row[idf]=DATA[SEDANG_EDIT][idf];
  panggil({op:'save',sheet:TAB,row:row},()=>{toast(SEDANG_EDIT!=null?'Perubahan tersimpan ✓':'Data baru tersimpan ✓');tutupForm();muat()});
}
function hapus(i){
  const row=DATA[i];
  if(!confirm('Hapus permanen: "'+((row.judul||row.nama||row.keterangan||row.key)||'data ini')+'" ?'))return;
  panggil({op:'del',sheet:TAB,id:row.id||row.key},()=>{toast('Terhapus','ok');muat()});
}
</script>
</body>
</html>
